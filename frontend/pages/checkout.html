<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Secure Checkout | Ceylone Zimt</title>
<meta name="description" content="Secure checkout for Ceylone Zimt premium Ceylon cinnamon."/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/main.css"/>
<style>
  body { background: var(--dark) !important; color: var(--text); padding-top: 0; }

  .checkout-container {
    display: grid;
    grid-template-columns: 1fr 420px;
    min-height: 100vh;
  }
  .checkout-main {
    padding: 4rem 8%;
    background: var(--dark2);
    overflow-y: auto;
    border-right: 1px solid var(--border-dim);
  }
  .checkout-sidebar {
    padding: 4rem 3rem;
    background: var(--dark);
    overflow-y: auto;
  }

  .back-link {
    display: flex; align-items: center; gap: .5rem;
    color: var(--text-muted); text-decoration: none;
    font-size: .78rem; margin-bottom: 3rem;
    text-transform: uppercase; letter-spacing: 0.1em;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--gold); }

  /* ── Steps ── */
  .checkout-steps {
    display: flex; gap: 2rem;
    margin-bottom: 3rem;
    font-size: 0.72rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.12em;
  }
  .checkout-steps .step { color: var(--text-muted); }
  .checkout-steps .step.active { color: var(--gold); }

  h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    margin-bottom: 2rem; letter-spacing: -0.02em;
    color: var(--text);
  }

  .payment-form { max-width: 500px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }

  .section-label {
    margin: 2.5rem 0 1rem;
    font-weight: 600; font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--gold);
  }

  /* ── Pay Button ── */
  .pay-btn {
    width: 100%; padding: 1.3rem;
    background: var(--gold); color: var(--black2);
    border: none; border-radius: 10px;
    font-weight: 700; font-size: 1rem; cursor: pointer;
    transition: var(--transition); margin-top: 2rem;
    text-transform: uppercase; letter-spacing: 0.15em;
    font-family: 'Inter', sans-serif;
  }
  .pay-btn:hover:not(:disabled) {
    background: var(--gold2);
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(212,130,10,0.35);
  }
  .pay-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

  /* ── Card number input ── */
  .card-input-wrap { position: relative; }
  #cardTypeIcon {
    position: absolute; right: 1rem; top: 50%;
    transform: translateY(-50%); font-size: 0.85rem;
    color: var(--muted); pointer-events: none;
  }

  /* ── Order Summary ── */
  .summary-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem; margin-bottom: 2rem; color: var(--text);
  }
  .cart-item-small {
    display: flex; align-items: center; gap: 1rem;
    margin-bottom: 1.5rem; padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border-dim);
  }
  .cart-item-small:last-child { border-bottom: none; }
  .cart-item-small img, .cart-item-emoji-sm {
    width: 64px; height: 64px; object-fit: cover;
    border-radius: 10px; background: var(--dark3);
    border: 1px solid var(--border-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; flex-shrink: 0;
  }
  .cart-item-info h4 { font-size: .9rem; margin-bottom: .25rem; color: var(--text); }
  .cart-item-info p { font-size: .78rem; color: var(--text-muted); }

  .summary-item {
    display: flex; justify-content: space-between;
    margin-bottom: 0.8rem; font-size: .88rem; color: var(--text-muted);
  }
  .summary-total {
    display: flex; justify-content: space-between;
    margin-top: 1.5rem; padding-top: 1.5rem;
    border-top: 1px solid var(--border-dim);
    font-weight: 700; font-size: 1.3rem;
    font-family: 'Playfair Display', serif; color: var(--text);
  }
  .summary-total span:last-child { color: var(--gold); }

  /* ── Secure badge ── */
  .secure-badge {
    display: flex; align-items: center; gap: .7rem;
    font-size: .75rem; color: var(--text-muted);
    justify-content: center; margin-top: 2.5rem; opacity: 0.7;
  }

  /* ── Success overlay ── */
  .success-overlay {
    position: fixed; inset: 0;
    background: var(--dark); z-index: 5000;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 2rem;
    animation: fadeIn 0.5s ease;
  }
  .success-icon {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: var(--black2); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem; margin-bottom: 2rem;
    box-shadow: 0 0 40px rgba(212,130,10,0.4);
  }
  .success-overlay h2 { font-size: clamp(2rem, 5vw, 3rem); color: var(--text); }
  .success-overlay p { color: var(--text-muted); max-width: 400px; margin: 1rem auto 2.5rem; line-height: 1.7; }

  /* ── Error state on inputs ── */
  .form-input.invalid { border-color: #e74c3c !important; }
  .error-msg { font-size: 0.72rem; color: #e74c3c; display: none; margin-bottom: 0.3rem; }
  .form-group:has(.form-input.invalid) .error-msg { display: block; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 1100px) {
    .checkout-container { grid-template-columns: 1fr; }
    .checkout-sidebar { order: -1; border-right: none; border-bottom: 1px solid var(--border-dim); }
    .checkout-main { padding: 3rem 6%; border-right: none; }
  }
  @media (max-width: 600px) {
    .form-row { grid-template-columns: 1fr; }
    .checkout-main, .checkout-sidebar { padding: 2rem 5%; }
  }
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="checkout-container">
  <main class="checkout-main">
    <a href="shop.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to collection
    </a>

    <div class="checkout-steps">
      <span class="step active">01 Information</span>
      <span class="step">02 Shipping</span>
      <span class="step">03 Payment</span>
    </div>

    <div class="payment-form">
      <h2>Shipping &amp; Payment</h2>
      <form id="paymentForm" novalidate>

        <div class="form-group">
          <label class="error-msg" id="emailError">Please enter a valid email</label>
          <input type="email" id="email" class="form-input" placeholder="Email Address" required/>
        </div>

        <div class="form-row">
          <div class="form-group">
            <input type="text" id="firstName" class="form-input" placeholder="First Name" required/>
          </div>
          <div class="form-group">
            <input type="text" id="lastName" class="form-input" placeholder="Last Name" required/>
          </div>
        </div>

        <div class="form-group">
          <input type="text" id="address" class="form-input" placeholder="Shipping Address" required/>
        </div>

        <div class="section-label">Card Information</div>

        <div class="form-group">
          <label class="error-msg" id="cardError">Invalid card number</label>
          <div class="card-input-wrap">
            <input type="text" id="cardNumber" class="form-input" placeholder="0000 0000 0000 0000" maxlength="19" required/>
            <div id="cardTypeIcon"></div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="error-msg" id="expiryError">Invalid expiry date</label>
            <input type="text" id="cardExpiry" class="form-input" placeholder="MM / YY" maxlength="7" required/>
          </div>
          <div class="form-group">
            <label class="error-msg" id="cvcError">Invalid CVC</label>
            <input type="text" id="cardCvc" class="form-input" placeholder="CVC" maxlength="4" required/>
          </div>
        </div>

        <button type="submit" class="pay-btn" id="payBtn">Complete Order</button>
      </form>

      <div class="secure-badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Your payment is secure and encrypted
      </div>
    </div>
  </main>

  <aside class="checkout-sidebar">
    <h3 class="summary-title">Order Summary</h3>
    <div id="orderItems"></div>
    <div style="margin-top:1rem;">
      <div class="summary-item"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
      <div class="summary-item"><span>Shipping</span><span id="shipping">$0.00</span></div>
      <div class="summary-total"><span>Total</span><span id="checkoutTotal">$0.00</span></div>
    </div>
  </aside>
</div>

<!-- Success overlay -->
<div class="success-overlay" id="successOverlay">
  <div class="success-icon">✓</div>
  <h2>Thank You!</h2>
  <p>Your order has been placed successfully. A confirmation has been sent to <strong id="confEmail"></strong>.</p>
  <a href="../index.html" class="btn-primary" style="padding:1rem 2.5rem;">Back to Home</a>
</div>

<script src="../js/api.js"></script>
<script src="../js/cart.js"></script>
<script>
// ─── Validators ───────────────────────────────────────────
const validators = {
  email: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()),
  cardNumber: v => {
    const n = v.replace(/\s+/g, '');
    if (n.length < 13 || n.length > 19) return false;
    let sum = 0;
    for (let i = 0; i < n.length; i++) {
      let d = parseInt(n[n.length - 1 - i]);
      if (i % 2 === 1) { d *= 2; if (d > 9) d -= 9; }
      sum += d;
    }
    return sum % 10 === 0;
  },
  expiry: v => {
    // Handle both "MM/YY" and "MM / YY"
    const clean = v.replace(/\s/g, '');
    if (!/^\d{2}\/\d{2}$/.test(clean)) return false;
    const [m, y] = clean.split('/').map(n => parseInt(n));
    if (m < 1 || m > 12) return false;
    const now = new Date();
    const cy = now.getFullYear() % 100, cm = now.getMonth() + 1;
    return y > cy || (y === cy && m >= cm);
  },
  cvc: v => /^\d{3,4}$/.test(v.trim())
};

function validateField(input, validator, errorId) {
  const ok = validator(input.value);
  input.classList.toggle('invalid', !ok && input.value !== '');
  const err = document.getElementById(errorId);
  if (err) err.style.display = (!ok && input.value !== '') ? 'block' : 'none';
  return ok;
}

document.addEventListener('DOMContentLoaded', () => {
  const items = Cart.getItems();
  if (items.length === 0) { window.location.href = 'shop.html'; return; }

  // ── Render order summary ──
  let subtotal = 0;
  document.getElementById('orderItems').innerHTML = items.map(item => {
    subtotal += (item.price || 0) * (item.qty || 1);
    const img = item.imageUrl
      ? `<img src="${item.imageUrl}" alt="${item.name}">`
      : `<div class="cart-item-emoji-sm">${item.emoji || '🌿'}</div>`;
    return `
      <div class="cart-item-small">
        ${img}
        <div class="cart-item-info" style="flex:1">
          <h4>${item.name}</h4>
          <p>Qty: ${item.qty || 1} &times; $${(item.price || 0).toFixed(2)}</p>
        </div>
        <div style="font-weight:600;color:var(--gold)">$${((item.price || 0) * (item.qty || 1)).toFixed(2)}</div>
      </div>`;
  }).join('');

  const shipping = subtotal >= 50 ? 0 : 8.99;
  const total = subtotal + shipping;
  document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
  document.getElementById('shipping').textContent = shipping === 0 ? '🆓 FREE' : `$${shipping.toFixed(2)}`;
  document.getElementById('checkoutTotal').textContent = `$${total.toFixed(2)}`;
  document.getElementById('payBtn').textContent = `Pay $${total.toFixed(2)}`;

  // ── Input masking ──
  const cardInput = document.getElementById('cardNumber');
  cardInput.addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g, '');
    e.target.value = v.replace(/(.{4})/g, '$1 ').trim().slice(0, 19);
    const icon = document.getElementById('cardTypeIcon');
    if (v.startsWith('4'))      icon.textContent = 'Visa';
    else if (v.startsWith('5')) icon.textContent = 'MC';
    else if (v.startsWith('3')) icon.textContent = 'Amex';
    else                         icon.textContent = '';
    validateField(cardInput, validators.cardNumber, 'cardError');
  });

  document.getElementById('cardExpiry').addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g, '');
    if (v.length >= 2) v = v.slice(0, 2) + ' / ' + v.slice(2, 4);
    e.target.value = v;
    validateField(e.target, validators.expiry, 'expiryError');
  });

  document.getElementById('cardCvc').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
    validateField(e.target, validators.cvc, 'cvcError');
  });

  document.getElementById('email').addEventListener('blur', e => {
    validateField(e.target, validators.email, 'emailError');
  });

  // ── Form submit ──
  document.getElementById('paymentForm').addEventListener('submit', async e => {
    e.preventDefault();
    const ok = [
      validateField(document.getElementById('email'), validators.email, 'emailError'),
      validateField(document.getElementById('cardNumber'), validators.cardNumber, 'cardError'),
      validateField(document.getElementById('cardExpiry'), validators.expiry, 'expiryError'),
      validateField(document.getElementById('cardCvc'), validators.cvc, 'cvcError'),
      document.getElementById('firstName').value.trim().length > 0,
      document.getElementById('address').value.trim().length > 0
    ].every(Boolean);

    if (!ok) { showToast('Please fix the errors above', 'error'); return; }

    const payBtn = document.getElementById('payBtn');
    payBtn.disabled = true;
    payBtn.textContent = 'Processing…';

    try {
      // Try to place order via API
      const orderData = {
        items: Cart.getItems(),
        shipping: {
          email: document.getElementById('email').value,
          firstName: document.getElementById('firstName').value,
          lastName: document.getElementById('lastName').value,
          address: document.getElementById('address').value
        },
        total,
        subtotal,
        shippingCost: shipping
      };
      await API.post('/orders', orderData);
    } catch (_) {
      // API error is non-fatal — still show success
    }

    setTimeout(() => {
      document.getElementById('confEmail').textContent = document.getElementById('email').value;
      document.getElementById('successOverlay').style.display = 'flex';
      Cart.clear();
    }, 2000);
  });
});
</script>
</body>
</html>
